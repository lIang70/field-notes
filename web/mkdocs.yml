# Site build config — everything web-related lives in this folder.
# Notes live at the repo root (`go/`, `rust/`, `os/`, `ai/`) and are staged into
# `web/.build/docs` by `web/build.py` before Zensical runs, so the repository
# layout stays exactly as it is on GitHub. Paths below are relative to web/.
#
# `nav:` is intentionally absent: web/build.py generates it (plus a card-grid
# landing page per directory) into web/mkdocs.generated.yml, which is what
# Zensical actually builds. See web/generate.py.
site_name: field notes
site_url: https://liang70.github.io/field-notes/
site_description: l1ang70 的个人工程笔记 — C++ / Go / OS / AI，写给快速回忆，不写教科书。
site_author: l1ang70
repo_url: https://github.com/lIang70/field-notes
repo_name: lIang70/field-notes

docs_dir: .build/docs
site_dir: .build/site

theme:
  name: material
  # `classic` keeps Material for MkDocs' appearance — web/stylesheets/theme.css
  # is written against that DOM and its `--md-*` custom properties.
  variant: classic
  custom_dir: overrides
  language: zh
  font: false # system CJK stack, no webfont round-trip
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切到浅色
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/theme.css

extra:
  generator: false
markdown_extensions:
  - meta
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      # lunr tokenizes on whitespace by default, which turns a whole Chinese
      # sentence into one token. Split on CJK punctuation as well.
      separator: '[\s\u200b\-，。、；：！？（）「」『』《》【】…]+'

validation:
  omitted_files: ignore
  absolute_links: info
  unrecognized_links: ignore
  anchors: warn
